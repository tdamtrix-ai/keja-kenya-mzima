<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEJA 47 COUNTIES - ALL LOCATIONS</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
.header{background:#0a8a0a;color:white;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
.btn-post{background:#25D366;color:white;padding:15px;margin:10px;border-radius:12px;display:block;text-align:center;text-decoration:none;font-weight:bold}
.filter-box{background:white;padding:10px;margin:10px;border-radius:10px}
.filter-box select,.filter-box input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.card{background:white;margin:10px;border-radius:10px;box-shadow:0 2px 5px #ccc;cursor:pointer}
.card-body{padding:12px}
.badge{background:#0a8a0a;color:white;padding:3px 8px;border-radius:10px;font-size:12px}
.wa-btn{background:#25D366;color:white;padding:12px;display:block;text-align:center;border-radius:8px;text-decoration:none;margin-top:8px;font-weight:bold}
#postForm{display:none;background:white;margin:10px;padding:15px;border-radius:10px;border:2px solid #0a8a0a}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.pay-btn{background:#0a8a0a;color:white;padding:16px;width:100%;border:none;border-radius:10px;font-weight:bold;font-size:18px}
.mpesa-box{background:#FFF3CD;padding:12px;border-radius:8px;border:1px solid #FFC107;margin:10px 0;text-align:center}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:20;padding:20px;box-sizing:border-box}
.modal-content{background:white;padding:15px;border-radius:10px;margin-top:20px;max-height:80vh;overflow:auto}
</style>
</head>
<body>

<div class="header">
<h2 style="margin:0">KEJA KENYA MZIMA</h2>
<small>47 COUNTIES + ALL LOCATIONS - 100% KENYA</small>
</div>

<div class="filter-box">
<select id="filterCounty" onchange="updateFilterLocations();filterKeja()">
<option value="">Chagua County - 47 Zote</option>
<option>Mombasa</option><option>Kwale</option><option>Kilifi</option><option>Tana River</option><option>Lamu</option><option>Taita Taveta</option><option>Garissa</option><option>Wajir</option><option>Mandera</option><option>Marsabit</option><option>Isiolo</option><option>Meru</option><option>Tharaka Nithi</option><option>Embu</option><option>Kitui</option><option>Machakos</option><option>Makueni</option><option>Nyandarua</option><option>Nyeri</option><option>Kirinyaga</option><option>Murang'a</option><option>Kiambu</option><option>Turkana</option><option>West Pokot</option><option>Samburu</option><option>Trans Nzoia</option><option>Uasin Gishu</option><option>Elgeyo Marakwet</option><option>Nandi</option><option>Baringo</option><option>Laikipia</option><option>Nakuru</option><option>Narok</option><option>Kajiado</option><option>Kericho</option><option>Bomet</option><option>Kakamega</option><option>Vihiga</option><option>Bungoma</option><option>Busia</option><option>Siaya</option><option>Kisumu</option><option>Homa Bay</option><option>Migori</option><option>Kisii</option><option>Nyamira</option><option>Nairobi</option>
</select>
<select id="filterLocation" onchange="filterKeja()">
<option value="">Chagua Location / Estate</option>
</select>
</div>

<a href="#" onclick="document.getElementById('postForm').style.display='block';return false;" class="btn-post">📢 POST NYUMBA - LIPA 300 KWANZA</a>

<div id="postForm">
<h3 style="text-align:center;color:#0a8a0a">47 COUNTIES + LOCATIONS ZOTE</h3>
<input type="text" id="lname" placeholder="Jina yako">
<input type="text" id="lphone" placeholder="WhatsApp 07xx - Itaonekana Direct!">
<select id="lcounty" onchange="updateLocations()">
<option value="">Chagua County Yako</option>
<option>Mombasa</option><option>Kwale</option><option>Kilifi</option><option>Tana River</option><option>Lamu</option><option>Taita Taveta</option><option>Garissa</option><option>Wajir</option><option>Mandera</option><option>Marsabit</option><option>Isiolo</option><option>Meru</option><option>Tharaka Nithi</option><option>Embu</option><option>Kitui</option><option>Machakos</option><option>Makueni</option><option>Nyandarua</option><option>Nyeri</option><option>Kirinyaga</option><option>Murang'a</option><option>Kiambu</option><option>Turkana</option><option>West Pokot</option><option>Samburu</option><option>Trans Nzoia</option><option>Uasin Gishu</option><option>Elgeyo Marakwet</option><option>Nandi</option><option>Baringo</option><option>Laikipia</option><option>Nakuru</option><option>Narok</option><option>Kajiado</option><option>Kericho</option><option>Bomet</option><option>Kakamega</option><option>Vihiga</option><option>Bungoma</option><option>Busia</option><option>Siaya</option><option>Kisumu</option><option>Homa Bay</option><option>Migori</option><option>Kisii</option><option>Nyamira</option><option>Nairobi</option>
</select>
<select id="lloc">
<option value="">Chagua Estate / Location Kwanza Chagua County</option>
</select>
<input type="text" id="llocOther" placeholder="Au andika Estate yako kama haipo kwa list">
<select id="ltype"><option>Single - 300/Year</option><option>Bedsitter - 600/Year</option><option>1 Bedroom - 900/Year</option><option>2 Bedroom - 1200/Year</option><option>3 Bedroom - 1500/Year</option></select>
<input type="text" id="lrent" placeholder="Rent e.g 3500">
<div class="mpesa-box"><b>💰 LIPA M-PESA TILL 123456 - 300 BOB</b><br><small>Keja Kenya Mzima - Lipa ndio number yako ionekane!</small></div>
<input type="text" id="mpesaCode" placeholder="Weka M-Pesa Code baada ya kulipa">
<button class="pay-btn" onclick="checkPayment()">✅ NIMELIPA - POST SAI HII</button>
</div>

<div id="listings"></div>
<div id="locModal" class="modal" onclick="this.style.display='none'"><div class="modal-content" id="modalContent"></div></div>

<script>
const countyLocations={
"Nairobi":["Mwiki","Kasarani","Roysambu","Umoja","Kayole","Donholm","Buruburu","Embakasi","Pipeline","Fedha","Ruai","Kahawa West","Kahawa Sukari","Zimmerman","Githurai 44","Githurai 45","Kariobangi","Dandora","Komarock","Utawala","Syokimau","South B","South C","Langata","Kibera","Kawangware","Kangemi","Westlands","Parklands","Eastleigh","Pangani","Ngara","Kilimani","Kileleshwa","Lavington","Runda","Karen"],
"Mombasa":["Bamburi","Nyali","Likoni","Kisauni","Tudor","Mtwapa","Shanzu","Bombolulu","Mikindani","Changamwe","Jomvu","Magongo"],
"Kiambu":["Ruiru","Thika","Juja","Kikuyu","Limuru","Githurai","Kiambu Town","Karuri","Banana","Gachie","Kahawa Wendani","Membley","Witeithie","Kiganjo"],
"Nakuru":["Nakuru Town","Naivasha","Gilgil","Njoro","Molo","Bahati","Lanet","Section 58","Milimani","Kiamunyi","Kabarak"],
"Kisumu":["Kisumu Town","Kondele","Mamboleo","Milimani","Nyalenda","Manyatta","Migosi","Tom Mboya","Kajulu"],
"Machakos":["Mlolongo","Athi River","Syokimau","Kitengela","Machakos Town","Kangundo","Mavoko","Katani"],
"Kajiado":["Kitengela","Kajiado Town","Ongata Rongai","Ngong","Kiserian","Isinya","Loitokitok"],
"Uasin Gishu":["Eldoret Town","Langas","Kapsoya","Annex","Elgon View","Pioneer","Huruma","Kimumu"],
"Kakamega":["Kakamega Town","Lurambi","Mumias","Lugari","Butere","Khwisero"],
"Kisii":["Kisii Town","Suneka","Nyamataro","Mosocho","Ogembo"],
"Kilifi":["Kilifi Town","Malindi","Watamu","Mtwapa","Mariakani","Kaloleni"],
"Kwale":["Kwale Town","Ukunda","Diani","Msambweni","Kinango"],
"Garissa":["Garissa Town","Dadaab","Ijara","Balambala"],
"Meru":["Meru Town","Maua","Nkubu","Timau","Mitunguu"],
"Nyeri":["Nyeri Town","Karatina","Othaya","Mukurweini","Tetu"],
"Murang'a":["Murang'a Town","Kangema","Kandara","Maragua","Kenol"],
"Turkana":["Lodwar","Kakuma","Lokichoggio","Lokitaung"],
"Kitui":["Kitui Town","Mwingi","Mutomo","Kyuso"],
"Makueni":["Wote","Makindu","Mtito Andei","Kibwezi","Mbooni"],
"Narok":["Narok Town","Narok North","Kilgoris","Ololulunga"],
"Kericho":["Kericho Town","Litein","Kapsoit","Kipkelion"],
"Bungoma":["Bungoma Town","Webuye","Kimilili","Sirisia","Malakisi"],
"Busia":["Busia Town","Malaba","Nambale","Port Victoria"],
"Siaya":["Siaya Town","Bondo","Ugunja","Yala","Ukwala"],
"Homa Bay":["Homa Bay Town","Oyugis","Kendubay","Mbita","Ndhiwa"],
"Migori":["Migori Town","Rongo","Awendo","Kehancha","Isebania"],
"Embu":["Embu Town","Runyenjes","Manyatta","Siakago"],
"Tharaka Nithi":["Chuka","Chogoria","Marimanti","Kathwana"],
"Nyandarua":["Ol Kalou","Nyahururu","Engineer","Ol Joro Orok"],
"Kirinyaga":["Kerugoya","Kutus","Sagana","Wanguru","Kagio"],
"West Pokot":["Kapenguria","Makutano","Chepareria","Sigor"],
"Trans Nzoia":["Kitale","Endebess","Kiminini","Kwanza"],
"Baringo":["Kabarnet","Eldama Ravine","Marigat","Kabartonjo"],
"Laikipia":["Nanyuki","Nyahururu","Rumuruti","Nanyuki Town"],
"Bomet":["Bomet Town","Sotik","Chepalungu","Konoin"],
"Vihiga":["Vihiga Town","Mbale","Luanda","Majengo"],
"Taita Taveta":["Voi","Taveta","Wundanyi","Mwatate"],
"Tana River":["Hola","Garsen","Bura","Madogo"],
"Lamu":["Lamu Town","Mpeketoni","Witu","Faza"],
"Wajir":["Wajir Town","Habaswein","Tarbaj","Wajir East"],
"Mandera":["Mandera Town","El Wak","Rhamu","Takaba"],
"Marsabit":["Marsabit Town","Moyale","Laisamis","North Horr"],
"Isiolo":["Isiolo Town","Merti","Garbatulla","Kinna"],
"Samburu":["Maralal","Baragoi","Wamba","Archers Post"],
"Elgeyo Marakwet":["Iten","Kapsowar","Chepkorio","Kapcherop"],
"Nandi":["Kapsabet","Nandi Hills","Kobujoi","Mosoriot"],
"Kajiado":["Kitengela","Rongai","Ngong","Kajiado"],
"Nyamira":["Nyamira Town","Nyansiongo","Keroka","Manga"]
};

function updateLocations(){let county=document.getElementById('lcounty').value;let locSelect=document.getElementById('lloc');locSelect.innerHTML='<option value="">Chagua Location</option>';if(countyLocations[county]){countyLocations[county].forEach(l=>{let o=document.createElement('option');o.value=l;o.textContent=l;locSelect.appendChild(o);});}}
function updateFilterLocations(){let county=document.getElementById('filterCounty').value;let locSelect=document.getElementById('filterLocation');locSelect.innerHTML='<option value="">All Locations in '+county+'</option>';if(countyLocations[county]){countyLocations[county].forEach(l=>{let o=document.createElement('option');o.value=l;o.textContent=l;locSelect.appendChild(o);});}}

let allKeja=[
{name:"John",phone:"254700000000",county:"Nairobi",loc:"Mwiki",type:"Single",rent:"3500"},
{name:"Mama Njeri",phone:"254711111111",county:"Kiambu",loc:"Ruiru",type:"Bedsitter",rent:"6500"},
{name:"Ali",phone:"254722222222",county:"Mombasa",loc:"Bamburi",type:"1 Bedroom",rent:"12000"},
{name:"Otieno",phone:"254733333333",county:"Kisumu",loc:"Kondele",type:"Single",rent:"3000"}
];
function render(list){let d=document.getElementById('listings');d.innerHTML='';list.forEach(k=>{let c=document.createElement('div');c.className='card';c.onclick=()=>showLoc(k);c.innerHTML=`<div class="card-body"><span class="badge">${k.county}</span> <span class="badge" style="background:#25D366">${k.loc}</span> <b>${k.type}</b><br>Rent: Ksh ${k.rent} | Landlord: ${k.name}<br><small>📍 ${k.loc}, ${k.county} County</small><br><span style="color:#0a8a0a;font-weight:bold">📞 ${k.phone} - Direct!</span><br><a href="https://wa.me/${k.phone}" class="wa-btn" onclick="event.stopPropagation()">Chat ${k.name} Direct - ${k.phone}</a></div>`;d.appendChild(c);});}
function showLoc(k){document.getElementById('modalContent').innerHTML=`<h3>📍 ${k.loc}, ${k.county} County</h3><p><b>${k.type}</b> - Ksh ${k.rent}/month</p><p>Landlord: ${k.name}</p><p><b>Number Inaonekana Direct:</b> ${k.phone}</p><p><b>Exact Location:</b> ${k.loc}, ${k.county}</p><a href="https://www.google.com/maps/search/?api=1&query=${k.loc}+${k.county}+Kenya" target="_blank" class="wa-btn" style="background:#0a8a0a">🗺️ ONA ${k.loc} KWA GOOGLE MAP</a><br><a href="https://wa.me/${k.phone}?text=Habari ${k.name}, nimeona nyumba yako ya ${k.type} ${k.loc} kwa Keja Kenya Mzima" class="wa-btn">💬 CHAT LANDLORD DIRECT WHATSAPP</a><br><button onclick="document.getElementById('locModal').style.display='none'" style="width:100%;padding:10px;border:none;background:#eee;border-radius:8px">Funga</button>`;document.getElementById('locModal').style.display='block';}
function checkPayment(){let name=document.getElementById('lname').value;let phone=document.getElementById('lphone').value;let county=document.getElementById('lcounty').value;let loc=document.getElementById('lloc').value||document.getElementById('llocOther').value;let type=document.getElementById('ltype').value;let rent=document.getElementById('lrent').value;let code=document.getElementById('mpesaCode').value;if(!name||!phone||!county||!loc||!code){alert('Jaza Jina, Namba, County, Location na M-Pesa Code!');return;}let k={name,phone,county,loc,type,rent};allKeja.unshift(k);render(allKeja);document.getElementById('postForm').style.display='none';alert('Hongera '+name+'! Nyumba yako ya '+loc+', '+county+' ime-post! Tenant wata-ona number yako '+phone+' direct na location kwa Map!');}
function filterKeja(){let c=document.getElementById('filterCounty').value.toLowerCase();let l=document.getElementById('filterLocation').value.toLowerCase();let f=allKeja.filter(k=>(c==''||k.county.toLowerCase()==c||k.county.toLowerCase().includes(c))&&(l==''||k.loc.toLowerCase().includes(l)));render(f);}
render(allKeja);
</script>
</body>
</html>
