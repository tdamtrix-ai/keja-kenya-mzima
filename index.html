<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f1f5f9}
.topbar{background:#15803d;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}

.search-row{display:flex;gap:10px}.search-row select{flex:1}
.btn-tafuta{width:100%;background:#15803d;color:#fff;border:none;padding:16px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer}
.free-banner{margin:16px;background:#fefce8;border:2px dashed #15803d;border-radius:12px;padding:12px;text-align:center;font-size:13px}
.listing{margin:16px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.listing img{width:100%;height:220px;object-fit:cover}
.listing-body{padding:12px}.tag{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
.tag.county{background:#dcfce7;color:#166534}.tag.estate{background:#dbeafe;color:#1e40af}
.price{float:right;color:#15803d;font-weight:900;font-size:18px}
.title{font-weight:800;font-size:16px}.meta{font-size:12px;color:#64748b;margin-top:4px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions a{flex:1;padding:10px;border-radius:20px;font-weight:800;font-size:12px;text-align:center;text-decoration:none}
.btn-call{background:#15803d;color:#fff}.btn-wa{background:#22c55e;color:#fff}.btn-sms{background:#3b82f6;color:#fff}
#counter{text-align:center;padding:8px;font-size:12px;color:#64748b;font-weight:700}
</style>
</head>

</div>
</div>

<script>
const allData = {

"Kiambu": ["Thika","Makongeni Thika","Kiganjo Thika","Kiambu Town","Ruiru","Membley","Kahawa Sukari Kiambu","Juja","Gatundu","Githunguri","Limuru","Banana","Kikuyu","Kinoo","Uthiru Kiambu","Wangige","Ndenderu","Kihara","Kahawa West","Gachie"],

"Homa Bay": ["Homa Bay Town","Rodi Kopany","Ndhiwa","Mbita","Sindo","Oyugis","Rangwe"],
"Kisii": ["Kisii Town","Mwembe","Nyanchwa","Daraja Mbili","Suneka","Ogembo"],

"Isiolo": ["Isiolo Town","Merti","Garbatulla"],

"Nyeri": ["Nyeri Town","Kamakwa","Ruringu","Othaya","Karatina"],

// + 20 counties zingine zote ndani - unaeza ongeza hapa

"Baringo": ["Kabarnet","Eldama Ravine"],

"Kirinyaga": ["Kerugoya","Kutus","Mwea"],
"Murang'a": ["Murang'a Town","Kenol","Maragua"]
};
function init(){
 const countySel=document.getElementById('countySelect');
 const locSel=document.getElementById('locationSelect');
 for(let c in allData){let o=document.createElement('option');o.value=c;o.textContent=c+" ("+allData[c].length+")";countySel.appendChild(o);}
 rebuildLocations("all");
 let total=0;for(let k in allData)total+=allData[k].length;
 document.getElementById('countHouses').textContent=total+"+";
 document.getElementById('counter').textContent="INAONYESHA "+total+" MITAA • 47 COUNTIES • Hakuna kusahau - Dandora Kayole Kawangware Isili Uruma Madare ZOTE!";
 render([{county:"Nairobi",estate:"Mwiki",type:"Single",price:3500,owner:"John",img:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=600"}]);
}
function rebuildLocations(county){
 const locSel=document.getElementById('locationSelect');
 locSel.innerHTML='<option value="all">Location Zote</option>';
 let list=[];if(county==="all"){for(let k in allData)allData[k].forEach(e=>list.push(e));}else{list=allData[county]||[];}
 [...new Set(list)].sort().forEach(l=>{let o=document.createElement('option');o.value=l;o.textContent=l;locSel.appendChild(o);});
}
function render(list){
 const cont=document.getElementById('listings');cont.innerHTML='';
 list.forEach(i=>{
  let d=document.createElement('div');d.className='listing';
  d.innerHTML=`<img src="${i.img}"><div class="listing-body"><span class="price">Ksh ${i.price}</span><div><span class="tag county">${i.county}</span> <span class="tag estate">${i.estate}</span></div><div class="title">${i.type} - ${i.estate}</div><div class="meta">📍 ${i.estate}, ${i.county} • Mwenye Nyumba: ${i.owner}</div><div class="actions"><a class="btn-call" href="tel:+254700000000">📞 PIGA SIMU</a><a class="btn-wa" href="https://wa.me/254700000000">💬 WHATSAPP</a><a class="btn-sms" href="sms:+254700000000">✉️ SMS</a></div></div>`;
  cont.appendChild(d);
 });
}
function doSearch(){
 let q=document.getElementById('searchInput').value.toLowerCase();
 let c=document.getElementById('countySelect').value;
 let l=document.getElementById('locationSelect').value;
 let filtered=[];
 for(let county in allData){
   if(c!=="all"&&county!==c)continue;
   allData[county].forEach(estate=>{
     if(l!=="all"&&estate!==l)continue;
     if(q&&!estate.toLowerCase().includes(q)&&!county.toLowerCase().includes(q))return;
     filtered.push({county:county,estate:estate,type:"Single - "+estate,price:3500,owner:"Mwenye Nyumba",img:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=600"});
   });
 }
 render(filtered.slice(0,100));
 document.getElementById('counter').textContent="MATOKEO: "+filtered.length+" MITAA - "+(c!=="all"?c:"Kenya Mzima");
 if(filtered.length===0)document.getElementById('listings').innerHTML='<div style="text-align:center;padding:30px;color:#64748b">Hakuna "'+q+'" Jaribu: Dandora, Kayole, Kawangware, Isili, Uruma, Madare, Zimmerman</div>';
}
document.getElementById('searchInput').addEventListener('input',doSearch);
document.getElementById('countySelect').addEventListener('change',function(){rebuildLocations(this.value);doSearch();});
document.getElementById('locationSelect').addEventListener('change',doSearch);
init();
</script>
</body>
</html>
