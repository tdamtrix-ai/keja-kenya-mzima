<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weka Keja - Automatic</title><style>body{margin:0;font-family:system-ui;background:#0f172a;color:#fff;padding:15px}input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none}button{width:100%;padding:14px;background:#25D366;border:none;border-radius:10px;color:#fff;font-weight:900;font-size:16px;margin-top:10px}.card{background:#1e293b;padding:16px;border-radius:12px;margin-top:15px}</style></head><body>
<h2 style="color:#22c55e">🏠 Weka Keja Yako - Automatic</h2>
<p style="font-size:13px">Jaza, Lipa 300 kwa Pochi 0794147629, Keja itaonekana LIVE!</p>
<div class="card">
<label>aina ya keja</label><select id="type"><option>Bedsitter</option><option>1BR</option><option>2BR</option><option>3BR</option></select>
<label>Eneo (Baba Dogo, Kasarani...)</label><input id="area" placeholder="Baba Dogo">
<label>Bei KSh</label><input id="price" type="number" placeholder="6500">
<label>Namba yako ya WhatsApp</label><input id="phone" placeholder="0794147629">
<label>Maelezo</label><textarea id="desc" placeholder="Maji 24/7, Near Naivas..."></textarea>
<button onclick="orderNow()">💰 LIPA KSh 300 NA POCHI 0794147629</button>
<button onclick="whatsappOrder()" style="background:#1e293b;border:1px solid #334155">📤 Tuma Kwa WhatsApp Bila Kulipa (Jaribio)</button>
<div id="msg" style="margin-top:12px;font-size:13px"></div>
</div>
<script>
function orderNow(){
const data={type:document.getElementById('type').value,area:document.getElementById('area').value,price:document.getElementById('price').value,phone:document.getElementById('phone').value,desc:document.getElementById('desc').value}
if(!data.area||!data.price){alert('Jaza Eneo na Bei!');return}
localStorage.setItem('pending_keja',JSON.stringify(data))
document.getElementById('msg').innerHTML=`<div style="background:#16a34a;padding:12px;border-radius:8px">✅ Sawa! <br>1. Lipa <b>KSh 300</b> kwa Pochi <b>0794147629</b><br>2. Kisha bonyeza hapa chini kutuma uthibitisho</div><br><a href="https://wa.me/254794147629?text=Nimelipa%20300%20-%20${encodeURIComponent(JSON.stringify(data))}" style="background:#fff;color:green;padding:12px;display:block;text-align:center;border-radius:8px;text-decoration:none;font-weight:900">NIMELIPA - THIBITISHA WHATSAPP</a>`
}
function whatsappOrder(){
const data={type:document.getElementById('type').value,area:document.getElementById('area').value,price:document.getElementById('price').value,phone:document.getElementById('phone').value,desc:document.getElementById('desc').value}
window.open(`https://wa.me/254794147629?text=Nataka%20kuweka%20keja:%20${encodeURIComponent(JSON.stringify(data))}`,'_blank')
}
</script>
</body></html>
